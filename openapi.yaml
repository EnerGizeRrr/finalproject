openapi: 3.0.0
info:
  title: API управления задачами
  version: 1.0.0
  description: |
    API для управления задачами, проектами и комментариями.

    **Аутентификация:**
    Этот API использует аутентификацию по Bearer Token (Sanctum). Для аутентификации включите заголовок `Authorization` с действительным токеном:
    `Authorization: Bearer {ваш_токен}`

    Для получения токена используйте `/api/v1/login` или `/api/v1/register`.

    **Вебхуки:**
    API отправляет вебхуки на URL, указанный в подписке. Запросы подписываются с помощью HMAC-SHA256 и содержат заголовок `Idempotency-Key` для обеспечения идемпотентности.
    Подробности см. в описании модели `WebhookSubscription` и `WebhookAttempt`.

servers:
  - url: http://localhost/api/v1
    description: Локальный сервер разработки
security:
  - bearerAuth: [] # Глобальная аутентификация
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  schemas:
    LoginInput:
      type: object
      properties:
        email:
          type: string
          format: email
          example: "user@example.com"
        password:
          type: string
          format: password
          example: "password123"
      required:
        - email
        - password
    RegisterInput:
      type: object
      properties:
        name:
          type: string
          example: "John Doe"
        email:
          type: string
          format: email
          example: "user@example.com"
        password:
          type: string
          format: password
          example: "password123"
        password_confirmation:
          type: string
          format: password
          example: "password123"
      required:
        - name
        - email
        - password
        - password_confirmation
    AuthSuccessResponse:
      type: object
      properties:
        access_token:
          type: string
          example: "1|example_token_here..."
        token_type:
          type: string
          example: "Bearer"
        user:
          $ref: '#/components/schemas/User' # Опционально, если возвращается информация о пользователе
    User:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        email:
          type: string
          format: email
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    Project:
      type: object
      properties:
        id:
          type: integer
        name:
          type: string
        ownerId:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    ProjectInput:
      type: object
      properties:
        name:
          type: string
          required: true
    Task:
      type: object
      properties:
        id:
          type: integer
        title:
          type: string
        description:
          type: string
        status:
          type: string
          enum: [ "new", "in_progress", "blocked", "done", "cancelled" ]
        priority:
          type: string
          enum: [ "low", "normal", "high", "critical" ]
        dueDate:
          type: string
          format: date
        projectId:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    TaskInput:
      type: object
      properties:
        title:
          type: string
          required: true
        description:
          type: string
        status: # Optional for update, required for create if default is not set
          type: string
          enum: [ "new", "in_progress", "blocked", "done", "cancelled" ] # Corrected enum values
        priority: # Optional for update, required for create if default is not set
          type: string
          enum: [ "low", "normal", "high", "critical" ] # Corrected enum values
        due_date:
          type: string
          format: date
        project_id:
          type: integer
          required: true
    Comment:
      type: object
      properties:
        id:
          type: integer
        body:
          type: string
        taskId:
          type: integer
        userId:
          type: integer
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
    CommentInput:
      type: object
      properties:
        body:
          type: string
          required: true
        task_id:
          type: integer
          required: true
    WebhookSubscription:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        project_id:
          type: integer
          readOnly: true
        url:
          type: string
          format: uri
          description: URL для отправки запросов веб-хуков.
        events:
          type: array
          items:
            type: string
            enum: [ "task.completed", "task.status_changed" ]
          description: Список событий, на которые подписан этот веб-хук.
        enabled:
          type: boolean
          description: Активна ли подписка на веб-хук.
          default: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
    # ИСПРАВЛЕНО: WebhookSubscriptionInput
    WebhookSubscriptionInput:
      type: object
      properties:
        url:
          type: string
          format: uri
          description: URL для отправки запросов веб-хуков.
        events:
          type: array
          items:
            type: string
            enum: [ "task.completed", "task.status_changed" ]
          description: Список событий, на которые подписан этот веб-хук.
        enabled:
          type: boolean
          description: Активна ли подписка на веб-хук.
          default: true
      required:
        - url
        - events
    WebhookAttempt:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        idempotencyKey:
          type: string
          format: uuid
          readOnly: true
        webhookSubscriptionId:
          type: integer
          readOnly: true
        status:
          type: string
          enum: [ "success", "failed" ]
          readOnly: true
        statusCode:
          type: integer
          nullable: true
          readOnly: true
        responseBody:
          type: string
          nullable: true
          readOnly: true
        payload:
          type: object # Or more specific schema if known
          readOnly: true
        createdAt:
          type: string
          format: date-time
          readOnly: true
        updatedAt:
          type: string
          format: date-time
          readOnly: true
    PaginationLinks:
      type: object
      properties:
        first: { type: string, format: uri, nullable: true }
        last: { type: string, format: uri, nullable: true }
        prev: { type: string, format: uri, nullable: true }
        next: { type: string, format: uri, nullable: true }
    PaginationMeta:
      type: object
      properties:
        current_page: { type: integer }
        from: { type: integer, nullable: true }
        last_page: { type: integer }
        links:
          type: array
          items:
            type: object
            properties:
              url: { type: string, format: uri, nullable: true }
              label: { type: string }
              active: { type: boolean }
        path: { type: string, format: uri }
        per_page: { type: integer }
        to: { type: integer, nullable: true }
        total: { type: integer }
    ErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: "Неаутентифицирован."
    ValidationErrorResponse:
      type: object
      properties:
        message:
          type: string
          example: "Предоставленные данные недействительны."
        errors:
          type: object
          additionalProperties:
            type: array
            items:
              type: string
              example: "Поле 'name' является обязательным."
    TaskPaginatedResponse:
      type: object
      properties:
        data:
          type: array
          items:
            $ref: '#/components/schemas/Task'
          links:
            $ref: '#/components/schemas/PaginationLinks'
          meta:
            $ref: '#/components/schemas/PaginationMeta'
paths:
  /login:
    post:
      summary: Аутентификация пользователя
      description: |
        Аутентифицирует пользователя и возвращает токен доступа.
        Пример запроса:
        ```bash
        curl -X POST http://localhost/api/v1/login \
          -H "Content-Type: application/json" \
          -d '{"email": "user@example.com", "password": "password123"}'
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginInput'
      responses:
        '200':
          description: |
            Успешная аутентификация.
            Пример ответа:
            ```json
            {
              "access_token": "1|example_token_here...",
              "token_type": "Bearer"
            }
            ```
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '422':
          description: |
            Ошибка валидации.
            Пример ответа:
            ```json
            {
              "message": "Предоставленные данные недействительны.",
              "errors": {
                "email": [
                  "Неверные учетные данные."
                ]
              }
            }
            ```
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /register:
    post:
      summary: Регистрация нового пользователя
      description: |
        Регистрирует нового пользователя и возвращает токен доступа.
        Пример запроса:
        ```bash
        curl -X POST http://localhost/api/v1/register \
          -H "Content-Type: application/json" \
          -d '{"name": "John Doe", "email": "user@example.com", "password": "password123", "password_confirmation": "password123"}'
        ```
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterInput'
      responses:
        '201':
          description: |
            Пользователь успешно зарегистрирован.
            Пример ответа:
            ```json
            {
              "access_token": "1|example_token_here...",
              "token_type": "Bearer",
              "user": {
                "id": 1,
                "name": "John Doe",
                "email": "user@example.com",
                "created_at": "2023-10-27T10:00:00Z",
                "updated_at": "2023-10-27T10:00:00Z"
              }
            }
            ```
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthSuccessResponse'
        '422':
          description: |
            Ошибка валидации.
            Пример ответа:
            ```json
            {
              "message": "Предоставленные данные недействительны.",
              "errors": {
                "email": [
                  "Пользователь с таким email уже существует."
                ]
              }
            }
            ```
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /projects:
    get:
      summary: Получить все проекты
      responses:
        '200':
          description: |
            Успешный ответ.
            Пример ответа:
            ```json
            {
              "data": [
                {
                  "id": 1,
                  "name": "Проект 1",
                  "ownerId": 1,
                  "createdAt": "2023-10-27T10:00:00Z",
                  "updatedAt": "2023-10-27T10:00:00Z"
                }
              ],
              "links": {
                "first": "http://localhost/api/v1/projects?page=1",
                "last": "http://localhost/api/v1/projects?page=1",
                "prev": null,
                "next": null
              },
              "meta": {
                "current_page": 1,
                "from": 1,
                "last_page": 1,
                "links": [...],
                "path": "http://localhost/api/v1/projects",
                "per_page": 15,
                "to": 1,
                "total": 1
              }
            }
            ```
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
    post:
      summary: Создать новый проект
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
            examples:
              createProject:
                summary: Пример создания проекта
                value:
                  name: "Новый проект"
            description: |
              Пример запроса:
              ```bash
              curl -X POST http://localhost/api/v1/projects \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer YOUR_API_TOKEN" \
                -d '{"name": "Новый проект"}'
              ```
      responses:
        '201':
          description: |
            Проект создан.
            Пример ответа:
            ```json
            {
              "id": 1,
              "name": "Новый проект",
              "ownerId": 1,
              "createdAt": "2023-10-27T10:00:00Z",
              "updatedAt": "2023-10-27T10:00:00Z"
            }
            ```
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '422':
          description: |
            Ошибка валидации.
            Пример ответа:
            ```json
            {
              "message": "Предоставленные данные недействительны.",
              "errors": {
                "name": [
                  "Поле 'name' является обязательным."
                ]
              }
            }
            ```
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /projects/{id}:
    get:
      summary: Получить проект по ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID проекта
      responses:
        '200':
          description: |
            Успешный ответ.
            Пример ответа:
            ```json
            {
              "id": 1,
              "name": "Проект 1",
              "ownerId": 1,
              "createdAt": "2023-10-27T10:00:00Z",
              "updatedAt": "2023-10-27T10:00:00Z"
            }
            ```
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
    put:
      summary: Обновить проект
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID проекта
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectInput'
            description: |
              Пример запроса:
              ```bash
              curl -X PUT http://localhost/api/v1/projects/1 \
                -H "Content-Type: application/json" \
                -H "Authorization: Bearer YOUR_API_TOKEN" \
                -d '{"name": "Обновленный проект"}'
              ```
      responses:
        '200':
          description: |
            Проект обновлен.
            Пример ответа:
            ```json
            {
              "id": 1,
              "name": "Обновленный проект",
              "ownerId": 1,
              "createdAt": "2023-10-27T10:00:00Z",
              "updatedAt": "2023-10-27T11:00:00Z"
            }
            ```
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '422':
          description: |
            Ошибка валидации.
            Пример ответа:
            ```json
            {
              "message": "Предоставленные данные недействительны.",
              "errors": {
                "name": [
                  "Поле 'name' является обязательным."
                ]
              }
            }
            ```
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
    delete:
      summary: Удалить проект
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID проекта
      responses:
        '204':
          description: Проект успешно удален
        '404':
          description: |
            Проект не найден.
            Пример ответа:
            ```json
            {
              "message": "Запрашиваемый ресурс не найден."
            }
            ```
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /projects/{projectId}/tasks:
    get:
      summary: Получить все задачи для проекта
      parameters:
        - in: path
          name: projectId
          required: true
          schema:
            type: integer
          description: ID проекта
        - in: query
          name: status
          schema:
            type: string
            enum: [ "new", "in_progress", "blocked", "done", "cancelled" ]
          description: Фильтр задач по статусу
        - in: query
          name: priority
          schema:
            type: string
            enum: [ "low", "normal", "high", "critical" ]
          description: Фильтр задач по приоритету
        - in: query
          name: due_date_from
          schema:
            type: string
            format: date
          description: Фильтр задач по дате выполнения от (ГГГГ-ММ-ДД)
        - in: query
          name: due_date_to
          schema:
            type: string
            format: date
          description: Фильтр задач по дате выполнения до (ГГГГ-ММ-ДД)
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Task'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
    post:
      summary: Создать задачу в проекте
      parameters:
        - in: path
          name: projectId
          required: true
          schema:
            type: integer
          description: ID проекта
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskInput'
      responses:
        '201':
          description: Задача создана
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '422':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /tasks/{id}:
    get:
      summary: Получить задачу по ID
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID задачи
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
    put:
      summary: Обновить задачу
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID задачи
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskInput'
      responses:
        '200':
          description: Задача обновлена
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Task'
        '422':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
    delete:
      summary: Удалить задачу
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID задачи
      responses:
        '204':
          description: Задача успешно удалена
        '404':
          description: |
            Задача не найдена.
            Пример ответа:
            ```json
            {
              "message": "Запрашиваемый ресурс не найден."
            }
            ```
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /tasks/{taskId}/comments:
    get:
      summary: Получить комментарии к задаче
      parameters:
        - in: path
          name: taskId
          required: true
          schema:
            type: integer
          description: ID задачи
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/Comment'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
    post:
      summary: Создать комментарий к задаче
      parameters:
        - in: path
          name: taskId
          required: true
          schema:
            type: integer
          description: ID задачи
      requestBody:
        required: true
        content:
          application.json:
            schema:
              $ref: '#/components/schemas/CommentInput'
      responses:
        '201':
          description: Комментарий создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Comment'
        '422':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /projects/{id}/webhooks:
    get:
      summary: Получить веб-хуки проекта
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID проекта
      responses:
        '200':
          description: Успешный ответ
          content:
            application/json:
              schema:
                type: object
                properties:
                  data:
                    type: array
                    items:
                      $ref: '#/components/schemas/WebhookSubscription'
                  links:
                    $ref: '#/components/schemas/PaginationLinks'
                  meta:
                    $ref: '#/components/schemas/PaginationMeta'
    post:
      summary: Создать веб-хук для проекта
      parameters:
        - in: path
          name: id
          required: true
          schema:
            type: integer
          description: ID проекта
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WebhookSubscriptionInput'
      responses:
        '201':
          description: Веб-хук создан
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WebhookSubscription'
        '422':
          description: Ошибка валидации
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ValidationErrorResponse'
  /health:
    get:
      summary: Проверка состояния сервиса
      responses:
        '200':
          description: Сервис здоров
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ok
  /ready:
    get:
      summary: Проверка готовности сервиса
      description: Проверяет готовность сервиса к приему трафика (подключения к БД и Redis).
      responses:
        '200':
          description: Сервис готов к приему трафика
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: ready
        '503':
          description: Сервис не готов
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                    example: error
                  message:
                    type: string
                    example: Service is not ready
                  error:
                    type: string
                    example: "PDOException: could not find driver"
  /metrics:
